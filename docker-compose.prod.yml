services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wardrop
      POSTGRES_PASSWORD: wardrop
      POSTGRES_DB: wardrop
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      TZ: America/Sao_Paulo
      WARDROP_DATABASE_URL: postgresql://wardrop:wardrop@db:5432/wardrop
    env_file:
      - ./backend/.env
    depends_on:
      - db

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://wardrop-api.serverapp.com.br/api
    depends_on:
      - backend

volumes:
  pgdata:
